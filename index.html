<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="container">

    <h1>🎬 <span>Whoa!</span> Filmkort</h1>

    <div class="filmkort">

        <img
            id="poster" class="poster" src="poster" alt="Filmplakat"
            >

        <div class="film-info">

            <h2 id="title"></h2>

            <div class="info">

                <div class="info-box">
                    <strong>ÅR</strong>
                    <span id="år"></span>
                </div>

                <div class="info-box">
                    <strong>REGISSØR</strong>
                    <span id="regisør"></span>
                </div>

                <div class="info-box">
                    <strong>ROLLEFIGUR</strong>
                    <span id="rollefigur"></span>
                </div>

                <div class="info-box">
                    <strong>TIDSPUNKT</strong>
                    <span id="tidspunkt"></span>
                </div>

                <div class="info-box">
                    <strong>VARIGHET</strong>
                    <span id="varighet"></span>
                </div>

            </div>

            <div class="sitat">
                "Whoa!"
            </div>

            <div class="video-container">
                <video controls id="video">
                    <source src=" "  type="video/mp4">
                </video>
            </div>

        </div>

    </div>

    <button id="ny-film">Ny film</button>

</div>


    <script src="index.js"></script>
</body>
</html>
